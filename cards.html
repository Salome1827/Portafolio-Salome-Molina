<DOCTYPE html>
<html lang="es">
    <head>
<title>CARDS</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container my-5">
            <h2>CARDS</h2>
<!--Aqui va el pimer modelo de card -->
        <div class="col-md-4">
        <div class="card h-100 shadow-sm">
            <img src="Importante/DSC_0139.jpg" class="card-img-top" alt="Imagen de ejemplo">
            <div class="card-body">
                <h5 class="card-title">Card Estandar</h5>
                <p class="card-text">IDeal para productos destacados</p>
                <a href="#" class="btn btn-primary">Ver mas</a>
           </div>
           <br>
        </div>
<!--Aqui va el segundo modelo de card -->
        <div class="col-md-4">
            <div class="card h-100 border info">
         <div class="card-header bg-info text-white">
            Plan premium
            </div>
            <ul class="list-group list-group-flush text container">
                <li class="list-group-item">Sporte 24/7</li>
                <li class="list-group-item">100 GB de almacenamiento</li>
                <li class="list-group-item">Acceso VIP</li>
            </ul>
            <div class="card-body text-center">
                <button class="btn btn-info">Subscribirse</button>
             </div>
             <br>
            </div>
             <!--Aqui va el tercer modelo de card -->
             <div class="col-md-4">
                <div class ="card h_100 mb-3 overflow-hidden">
                    <div class="card-header bg-success text-white">
                        <div class="row g-0 h-100>
                            <div class="col-4">
                     <img src="Importante/DSC_0139.jpg" class="img-fluid rounded-start h-100" style="object-fit: cover;"
                            <div class="col-8">
                                <h5 class="card-title">Card con imagen lateral</h5>
                                <p class="card-text">Ideal para mostrar productos con imagen destacada</p>
                                <p class="card text"><small class="text-muted">Última actualización hace 2 días</small></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
