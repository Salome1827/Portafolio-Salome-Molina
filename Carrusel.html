<DOCTYPE html>
<html lang="en">
  <head>    
    <title>CARRUSEL</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- CARRUSEL ESTANDAR DE BOOTSTRAP 5-->
 <div class="carousel slide" data-bs-ride="carousel" id="demo"></div>
<!-- indicadores inferiores-->
 <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active" aria-current="true" aria-label="slide 1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1" aria-label="slide 2"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2" aria-label="slide 3"></button>
  </div>
<!--Contenido del carrusel-->
 <div class="carousel-inner">
<!--Slide 1 (activo por defecto)-->
    <div class="carousel-item active">
      <img src="image1.jpg" class="d-block w-100" alt="Descripcion">
    </div>
    <div class="carousel-caption d-none d-md-block">
        <h5>Titulo de la primera diapositiva</h5>
        <p>Descripcion de la primera diapositiva</p>
      </div>
    <div class="carousel-item">
      <img src="image2.jpg" class="d-block w-100" alt="Descripcion1">
      <div class="carousel-caption d-none d-md-block">
        <h5>Titulo de la segunda diapositiva</h5>
        <p>Descripcion de la segunda diapositiva</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="image3.jpg" class="d-block w-100" alt="Descripcion2">
      <div class="carousel-caption d-none d-md-block">
        <h5>Titulo de la tercera diapositiva</h5>
        <p>Descripcion de la tercera diapositiva</p>
      </div>
    </div>
  </div>
<!--Controles de navegación-->
 <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true>"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
  </button>
</div>
</body>
</html>
